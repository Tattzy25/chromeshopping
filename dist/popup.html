<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCommerce Settings</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #09090b;
      color: #fafafa;
    }
    h2 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    label {
      font-size: 11px;
      font-weight: bold;
      color: #d4d4d8;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #18181b;
      color: #ffffff;
      font-size: 12px;
      margin-bottom: 14px;
    }
    input:focus {
      outline: none;
      border-color: #ffffff;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 9999px;
      border: none;
      background: #ffffff;
      color: #000000;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover {
      opacity: 0.9;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      color: #34d399;
      display: none;
    }
  </style>
  <script type="module" crossorigin src="./popup.js"></script>
</head>
<body>
  <h2><span>⚡</span> LiveCommerce Copilot</h2>
  <div style="display: flex; align-items: center; justify-content: space-between; background: #18181b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;">
    <div>
      <div style="font-size: 12px; font-weight: bold;">Copilot Overlay</div>
      <div id="copilotStatusText" style="font-size: 10px; color: #34d399;">Active on page</div>
    </div>
    <button id="toggleCopilotBtn" style="width: auto; padding: 6px 14px; font-size: 11px; border-radius: 9999px; background: #27272a; color: #fafafa; border: 1px solid rgba(255,255,255,0.15);">Turn Off</button>
  </div>

  <label for="apiKey">OpenAI API Key</label>
  <input type="password" id="apiKey" placeholder="sk-... or ek-..." autocomplete="off" />

  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status">✓ Key saved! Extension ready.</div>

</body>
</html>

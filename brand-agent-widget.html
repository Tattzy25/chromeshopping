<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand Agent Widget</title>
<meta property="og:type" content="collection">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.0625rem);
  --text-lg:clamp(1.125rem,1rem + .5vw,1.375rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.1vw,2.1rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-6:1.5rem;
  --space-8:2rem;--space-10:2.5rem;--space-12:3rem;--space-16:4rem;
  --bg:#fbfbfc;--surface:#fff;--surface-2:#f4f4f5;--surface-3:#ebebed;
  --text:#101012;--text-muted:#6b6b72;--text-faint:#9a9aa1;
  --border:rgba(16,16,18,.10);--border-strong:rgba(16,16,18,.17);
  --accent:#101012;--on-accent:#fff;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:999px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font-display:'Bebas Neue',Impact,sans-serif;
  --font-body:'Inter',-apple-system,sans-serif;
  --shadow-sm:0 1px 2px rgba(16,16,18,.05);
  --shadow-md:0 4px 14px rgba(16,16,18,.07);
}
[data-theme="dark"]{
  --bg:#0b0b0d;--surface:#141416;--surface-2:#1b1b1e;--surface-3:#232327;
  --text:#f3f3f4;--text-muted:#a0a0a7;--text-faint:#6d6d74;
  --border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.18);
  --accent:#f3f3f4;--on-accent:#101012;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 6px 20px rgba(0,0,0,.5);
}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:var(--text-base);line-height:1.6;min-height:100dvh}
</style>
</head>
<body>


<script src="./widget.js"
        data-brand-name="TaTTTy"
        data-agent-name="NbaQey Th AI"
        data-accent="#101012"
        data-accent-dark="#f3f3f4"
        data-font-family="Inter"
        data-placement="bottom-right"
        data-mobile-placement="bottom-right"
        data-theme="auto"
        data-currency="USD"
        data-entry-label=""
        data-holdout="0"
        defer></script>
</body>
</html>
